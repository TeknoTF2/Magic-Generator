<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Circle & Rune Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Magic Circle & Rune Generator</h1>
            <p class="subtitle">Create intricate arcane symbols for your fantasy worlds</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="purpose">Purpose / Spell Name:</label>
                <input type="text" id="purpose" placeholder="e.g., Fireball, Protection, Summoning..." value="Protection">
            </div>

            <div class="control-group">
                <label for="complexity">Complexity: <span id="complexity-value">5</span></label>
                <input type="range" id="complexity" min="1" max="10" value="5">
                <div class="complexity-labels">
                    <span>Simple</span>
                    <span>Moderate</span>
                    <span>Intricate</span>
                </div>
            </div>

            <div class="button-group">
                <button id="generate-btn" class="btn btn-primary">Generate Circle</button>
                <button id="random-btn" class="btn btn-secondary">Random Purpose</button>
                <button id="export-btn" class="btn btn-success">Export PNG</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="magic-circle" width="800" height="800"></canvas>
        </div>

        <div class="info">
            <p>Complexity levels:</p>
            <ul>
                <li><strong>1-3:</strong> Simple circles and basic runes</li>
                <li><strong>4-6:</strong> Multiple layers with geometric patterns</li>
                <li><strong>7-10:</strong> Highly intricate, sprawling designs with interconnected elements</li>
            </ul>
        </div>
    </div>

    <script src="generator.js"></script>
</body>
</html>
